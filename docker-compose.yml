services:
  partsbin:
    build: .
    image: partsbin:latest
    container_name: partsbin
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PARTSBIN_PROVIDER: ${PARTSBIN_PROVIDER:-anthropic}
      PARTSBIN_LANGUAGE: ${PARTSBIN_LANGUAGE:-English}
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PARTSBIN_MODEL: ${PARTSBIN_MODEL:-claude-opus-5-5}
      PARTSBIN_EFFORT: ${PARTSBIN_EFFORT:-medium}
      # Ollama
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:7b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    extra_hosts:
      # Lets the container reach an Ollama running directly on the Docker host.
      - "host.docker.internal:host-gateway"
    volumes:
      - partsbin-data:/data

  # Optional bundled Ollama: `docker compose --profile ollama up -d`
  # and set OLLAMA_URL=http://ollama:11434 in .env.
  ollama:
    image: ollama/ollama:latest
    container_name: partsbin-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  partsbin-data:
  ollama-models:
